name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -coverprofile writes Go's native coverage format; -covermode=atomic
        # is required when -race is on (the default count mode is not
        # race-safe). The same invocation is used locally — see README.
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: Coveralls
        # Official Coveralls action; format=golang tells it to read Go's
        # native coverage profile rather than LCOV. The action picks up
        # GITHUB_TOKEN automatically for public repos.
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
